# PLAN step 6: sliced training on Task A, Gate A setting (owner decisions 2026-10-08, SRS D17 to D21).
# 4 workers, each holding 4 of 8 experts per layer, 125 local steps, 10 rounds = 5,000 worker steps
# of 64 sequences, equal to the centralized runs. Coverage assignment, router rows merged over holders.
# Model, task and optimizer settings are identical to configs/task_a/centralized.toml.
# Arms by override, for example:
#   --set sim.policy=rolling --set run.name=taskA-sliced-rolling
#   --set sim.router_rule=all --set run.name=taskA-sliced-routerall
#   --set sim.mode=partial --set sim.router_rule=all --set run.name=taskA-partial
#   --set sim.mode=full --set sim.router_rule=all --set run.name=taskA-fullavg

[run]
name = "taskA-sliced-coverage"
seed = 7
device = "cuda"
determinism = "warn"

[model]
vocab_size = 34          # 26 symbols + 8 map markers
context_length = 64
d_model = 128
n_layers = 4
n_heads = 4
expert_hidden = 256
n_experts = 8
top_k = 2
balance_coef = 0.0
attention = "explicit"
dispatch = "dense"

[task_a]
n_maps = 8
n_symbols = 26
seq_len = 64
marked = true
task_seed = 20261007

[optim]
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.0
warmup_steps = 100
grad_clip = 1.0
batch_size = 64
decay_fraction = 0.2       # final decay over the last 20% of each worker's 1,250-step trajectory
final_lr_ratio = 0.1

[eval]
curve_n_per_map = 256
curve_seed = 1001
gate_n_per_map = 2048
gate_seed = 1002
diagnostic_seed = 2001
save_model = true
worker_tables = true       # each worker's map-by-expert routing table per round (expert drift, S0-F-27)

[sim]
n_workers = 4
capacity = 4               # experts per layer per worker: at most half of 8 (S0-A-05)
local_steps = 125
rounds = 10
mode = "sliced"
policy = "coverage"
cross_layer = "same"
rolling_shift = 1
router_rule = "holders"
outer = "plain"
drop_prob = 0.0
skew = 0.0
equal_compute_steps = 5000
